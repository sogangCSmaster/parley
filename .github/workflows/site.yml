# 소개 페이지(site/)만 GitHub Pages(tolkmeet.com)에 올린다.
# 공개 저장소이므로 앱(server/·web/)은 여기서 빌드·배포하지 않고, 배포 비밀정보도 두지 않는다(docs/LAUNCH_PLAN.md).
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'design/tokens.css', '.github/workflows/site.yml']
  workflow_dispatch:

# 기본은 읽기만. Pages에 쓰는 권한은 배포 단계에만 준다. 외부 액션은 커밋 해시로 고정한다.
permissions:
  contents: read

concurrency:
  group: pages
  # 배포 도중 끊지 않는다(Pages 기본 예시와 같게)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
