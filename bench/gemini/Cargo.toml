[package]
name = "gemini-bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
dotenvy = "0.15.7"
base64 = "0.23.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
