<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메일, 인증 코드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}
</style>
</helmet>
<div style="width: 600px; height: 760px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif; padding: 40px 32px;">
  <div style="border-radius: 20px; background: #FFFFFF; padding: 40px 36px;">
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;"><svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>tolkmeet</span>
    <h1 style="margin: 32px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">인증 코드</h1>
    <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: #424245;">Tolkmeet 가입을 마치려면 아래 코드를 입력하세요. 코드는 10분 동안 쓸 수 있습니다.</p>
    <p style="margin: 26px 0 0; padding: 20px 0; border-radius: 14px; background: #F5F5F7; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: 0.3em;">481 927</p>
    <a href="#" style="margin-top: 22px; display: block; height: 50px; line-height: 50px; border-radius: 14px; background: {{button}}; color: #FFFFFF; text-align: center; font-size: 16px; font-weight: 700; text-decoration: none;">버튼으로 바로 인증하기</a>
    <p style="margin: 26px 0 0; font-size: 13px; line-height: 1.6; color: #6E6E73;">직접 요청하지 않으셨다면 이 메일은 무시하셔도 됩니다. 계정은 만들어지지 않습니다.</p>
  </div>
  <p style="margin: 22px 0 0; text-align: center; font-size: 12px; line-height: 1.6; color: #6E6E73;">[회사명] · [주소]<br>이 메일은 no-reply@mail.tolkmeet.com에서 보냈습니다.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":600,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
