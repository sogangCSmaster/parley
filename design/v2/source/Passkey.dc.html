<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>패스키로 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;">
  <div style="align-self: stretch; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;"><svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>tolkmeet</span>
    <a href="SignIn.dc.html" style="font-size: 14px;">이메일과 비밀번호로 로그인</a>
  </div>

  <div style="margin-top: 96px; width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <span style="width: 96px; height: 96px; border-radius: 48px; display: grid; place-items: center; background: #FFFFFF; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.2);">
      <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><path d="M2 21c.6-3.6 3-5.5 6-5.5 1.3 0 2.5.3 3.4 1"/><circle cx="18" cy="12" r="3" stroke="{{accent}}"/><path d="M18 15v6l-1.5-1.5L18 18" stroke="{{accent}}"/></svg>
    </span>
    <h1 style="margin: 24px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em;">패스키로 로그인</h1>
    <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.55; color: #6E6E73;">비밀번호 없이 Face ID, Touch ID, Windows Hello 또는 휴대폰으로 로그인합니다. 2차 인증도 함께 끝납니다.</p>
    <button type="button" style="margin-top: 30px; width: 100%; height: 54px; border: 0; border-radius: 14px; background: {{button}}; color: #FFFFFF; font-size: 18px; font-weight: 700;">패스키로 계속하기</button>
    <a href="SignIn.dc.html" style="margin-top: 16px; font-size: 14px;">패스키가 없나요? 다른 방법으로 로그인</a>
  </div>

  <div role="dialog" aria-label="시스템 패스키 확인 창 (예시)" style="position: absolute; right: 64px; top: 120px; width: 340px; padding: 22px; border-radius: 20px; background: rgba(246,246,248,0.92); backdrop-filter: blur(30px); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 30px 70px -20px rgba(0,0,0,0.35); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <span style="font-size: 12px; color: #6E6E73;">브라우저·운영체제가 띄우는 창</span>
    <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1D1D1F" stroke-width="1.2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9 16c1.6 1.2 4.4 1.2 6 0"/></svg>
    <p style="margin: 0; font-size: 15px; font-weight: 600;">“tolkmeet.com”에 로그인하시겠습니까?</p>
    <p style="margin: 0; font-size: 13px; color: #6E6E73;">minjun@company.com 패스키 사용</p>
    <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px;">
      <span style="height: 36px; line-height: 36px; border-radius: 10px; background: #E5E5EA; font-size: 14px;">취소</span>
      <span style="height: 36px; line-height: 36px; border-radius: 10px; background: #1D1D1F; color: #FFFFFF; font-size: 14px; font-weight: 600;">계속</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
