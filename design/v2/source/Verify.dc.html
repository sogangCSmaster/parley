<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이메일 인증</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;">
  <div style="align-self: stretch; height: 64px; display: flex; align-items: center; padding: 0 40px;">
    <a href="#" aria-label="Tolkmeet" style="display: flex; align-items: center; gap: 6px; color: #1D1D1F; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;">
      <svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>
      tolkmeet
    </a>
  </div>

  <div style="margin-top: 96px; width: 480px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <span style="width: 88px; height: 88px; border-radius: 44px; display: grid; place-items: center; background: #FFFFFF; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.2);">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/><circle cx="19" cy="6" r="3.2" fill="{{accent}}" stroke="#F5F5F7" stroke-width="1.6"/></svg>
    </span>
    <h1 style="margin: 28px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em;">메일을 확인해 주세요</h1>
    <p style="margin: 12px 0 0; font-size: 17px; line-height: 1.55; color: #6E6E73;"><b style="color: #1D1D1F; font-weight: 600;">minjun@company.com</b>으로 6자리 코드를 보냈습니다.<br>메일 속 버튼을 눌러도 바로 인증됩니다.</p>

    <form style="margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; gap: 10px;">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden;">인증 코드 6자리</legend>
        <input aria-label="1번째 숫자" value="4" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="2번째 숫자" value="8" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="3번째 숫자" value="1" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="4번째 숫자" value="" style="width: 56px; height: 68px; border: 2px solid {{accent}}; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="5번째 숫자" value="" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="6번째 숫자" value="" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
      </fieldset>
      <div style="display: flex; gap: 10px; align-items: flex-start; max-width: 420px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; text-align: left; font-size: 14px; line-height: 1.5; color: #1D1D1F;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#6E6E73" stroke-width="1.8" stroke-linecap="round" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
        <span>몇 분이 지나도 메일이 보이지 않으면 <b style="font-weight: 600;">스팸함</b>이나 프로모션함을 확인해 주세요. 보낸 사람은 no-reply@mail.tolkmeet.com입니다.</span>
      </div>
      <p style="margin: 0; font-size: 14px; color: #6E6E73;">메일이 오지 않았나요? <span style="color: #6E6E73;">52초 뒤 다시 보내기</span> · <a href="#">이메일 주소 바꾸기</a></p>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
