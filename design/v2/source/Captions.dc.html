<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자막 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A}a:hover{color:#9E2D14}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; border-radius: 36px; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 40px 12px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #6E6E73;">
      <span aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 18px;">
        <i style="width: 3px; height: 8px; border-radius: 2px; background: {{accent}};"></i>
        <i style="width: 3px; height: 16px; border-radius: 2px; background: {{accent}};"></i>
        <i style="width: 3px; height: 11px; border-radius: 2px; background: {{accent}};"></i>
        <i style="width: 3px; height: 18px; border-radius: 2px; background: {{accent}};"></i>
        <i style="width: 3px; height: 9px; border-radius: 2px; background: {{accent}};"></i>
      </span>
      듣는 중
    </div>
    <button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: rgba(118,118,128,0.12); color: #1D1D1F; font-size: 15px; font-weight: 600;">끝내기</button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 30px; padding: 0 64px 56px;">
    <div style="opacity: 0.3;">
      <p style="margin: 0; font-size: 13px; color: #6E6E73;">本日はお時間をいただきありがとうございます。</p>
      <p style="margin: 4px 0 0; font-size: 22px; font-weight: 600;">오늘 시간 내 주셔서 감사합니다.</p>
    </div>
    <div style="opacity: 0.45;">
      <p style="margin: 0; font-size: 14px; color: #6E6E73;">저희 서비스를 먼저 소개해 드릴게요.</p>
      <p style="margin: 4px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em;">まず弊社のサービスをご紹介します。</p>
    </div>
    <div style="opacity: 0.7;">
      <p style="margin: 0; font-size: 16px; color: #6E6E73;">予算について、もう少し詳しく確認したいです。</p>
      <p style="margin: 6px 0 0; font-size: 38px; line-height: 1.15; font-weight: 700; letter-spacing: -0.015em;">예산에 대해 조금 더 자세히 확인하고 싶습니다.</p>
    </div>
    <div>
      <p style="margin: 0; font-size: 19px; color: #6E6E73;">네, 어떤 부분이 궁금하세요?</p>
      <p style="margin: 8px 0 0; font-size: 60px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em;">はい、どの部分が<span style="color: #AEAEB2;">気になりますか</span></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
