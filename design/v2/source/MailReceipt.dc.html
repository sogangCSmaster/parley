<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메일, 결제 안내</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}
</style>
</helmet>
<div style="width: 600px; height: 760px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif; padding: 40px 32px;">
  <div style="border-radius: 20px; background: #FFFFFF; padding: 36px;">
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;"><svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>tolkmeet</span>
    <h1 style="margin: 28px 0 0; font-size: 26px; font-weight: 700;">Pro를 시작해 주셔서 감사합니다</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #424245;">매달 번역 회의 10시간을 쓸 수 있습니다. 다음 갱신일은 2027년 10월 17일입니다.</p>
    <div style="margin-top: 22px; border-radius: 14px; background: #F5F5F7; padding: 18px; display: flex; flex-direction: column; gap: 10px; font-size: 15px;">
      <div style="display: flex; justify-content: space-between;"><span style="color: #6E6E73;">Pro · 연간</span><span>$180.00</span></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #6E6E73;">세금</span><span>$0.00</span></div>
      <div style="height: 1px; background: #E5E5EA;"></div>
      <div style="display: flex; justify-content: space-between; font-weight: 700;"><span>합계</span><span>$180.00</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6E6E73;"><span>Visa ···· 4242</span><span>2026년 10월 17일</span></div>
    </div>
    <a href="Home.dc.html" style="margin-top: 22px; display: block; height: 50px; line-height: 50px; border-radius: 14px; background: {{button}}; color: #FFFFFF; text-align: center; font-size: 16px; font-weight: 700; text-decoration: none;">첫 회의 시작하기</a>
    <p style="margin: 18px 0 0; font-size: 13px; line-height: 1.6; color: #6E6E73;">결제는 판매 대행사 Paddle.com이 처리했으며, 세금 영수증은 Paddle이 따로 보냅니다. 해지와 영수증은 계정 › 요금제와 결제에서 할 수 있습니다.</p>
  </div>
  <p style="margin: 22px 0 0; text-align: center; font-size: 12px; line-height: 1.6; color: #6E6E73;">[회사명] · [주소]<br>이 메일은 no-reply@mail.tolkmeet.com에서 보냈습니다.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":600,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
