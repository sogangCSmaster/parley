<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화상 회의</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FF8A66}a:hover{color:#FFA285}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 36px; background: linear-gradient(160deg, #3B4A5C 0%, #1F2530 55%, #2D2433 100%); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', system-ui, sans-serif; color: #F5F5F7;">
  <div style="height: 100%; display: flex; border-radius: 16px; overflow: hidden; background: #1C1C1E; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);">

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative;">
      <span role="button" aria-label="화면 언어: 한국어" style="position: absolute; top: 26px; left: 28px; z-index: 5; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px 0 8px; border-radius: 980px; background: rgba(255,255,255,0.12); color: #F5F5F7; backdrop-filter: blur(16px); font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 1;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>한국어<svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg></span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 16px 96px;">
        <div style="position: relative; border-radius: 14px; overflow: hidden; background: #2C2C2E; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span style="width: 128px; height: 128px; border-radius: 64px; display: grid; place-items: center; background: linear-gradient(180deg, #A2A6B0 0%, #7D818C 100%); color: #FFFFFF; font-size: 54px; font-weight: 600; box-shadow: 0 0 0 4px #F2542D, 0 0 0 12px rgba(242,84,45,0.18);">さ</span>
          <span aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 16px; margin-top: 18px;"><i style="width: 3px; height: 7px; border-radius: 2px; background: #F2542D;"></i><i style="width: 3px; height: 15px; border-radius: 2px; background: #F2542D;"></i><i style="width: 3px; height: 10px; border-radius: 2px; background: #F2542D;"></i><i style="width: 3px; height: 16px; border-radius: 2px; background: #F2542D;"></i><i style="width: 3px; height: 8px; border-radius: 2px; background: #F2542D;"></i></span>
          <span style="margin-top: 10px; font-size: 15px; font-weight: 600; color: #F5F5F7;">さくら</span>
        </div>
        <div style="position: relative; border-radius: 14px; overflow: hidden; background: #2C2C2E; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span style="width: 128px; height: 128px; border-radius: 64px; display: grid; place-items: center; background: linear-gradient(180deg, #A2A6B0 0%, #7D818C 100%); color: #FFFFFF; font-size: 54px; font-weight: 600; ">민</span>
          <span aria-hidden="true" style="height: 16px; margin-top: 18px;"></span>
          <span style="margin-top: 10px; font-size: 15px; font-weight: 600; color: #F5F5F7;">민준 (나)</span>
        </div>
      </div>


      <div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; border-radius: 26px; background: rgba(44,44,46,0.75); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08);">
        <button type="button" aria-label="마이크" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="button" aria-label="카메라" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
        <button type="button" aria-label="번역 자막 켜짐" style="height: 48px; padding: 0 16px; border: 0; border-radius: 24px; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 13h4M13 13h4M7 16h7"/></svg>자막</button>
        <button type="button" aria-label="화면 공유" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 14V8M9 11l3-3 3 3M8 21h8"/></svg></button>
        <button type="button" aria-label="회의 나가기" style="width: 64px; height: 48px; border: 0; border-radius: 24px; background: #FF3B30; color: #FFFFFF; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 14c4-4 12-4 16 0l-2 2.5-3-1v-2.3a10 10 0 0 0-6 0v2.3l-3 1z"/></svg></button>
      </div>
    </div>

    <aside aria-label="대화 기록" style="width: 360px; flex: none; display: flex; flex-direction: column; background: #F5F5F7; color: #1D1D1F;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 0;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600;">대화 기록</h2>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6E6E73;">
          <span aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 12px;">
            <i style="width: 2px; height: 6px; border-radius: 1px; background: #F2542D;"></i>
            <i style="width: 2px; height: 12px; border-radius: 1px; background: #F2542D;"></i>
            <i style="width: 2px; height: 8px; border-radius: 1px; background: #F2542D;"></i>
          </span>
          듣는 중
        </span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 22px 26px;">
        <div style="opacity: 0.35;">
          <p style="margin: 0; font-size: 11px; color: #6E6E73;">私たちの投資チームは4人のメンバーです。</p>
          <p style="margin: 3px 0 0; font-size: 14px; font-weight: 600;">저희 투자팀은 4명의 멤버로 구성돼 있어요.</p>
        </div>
        <div style="opacity: 0.5;">
          <p style="margin: 0; font-size: 11px; color: #6E6E73;">주로 어떤 분야에 투자하고 계신가요?</p>
          <p style="margin: 3px 0 0; font-size: 15px; font-weight: 600;">主にどのような分野に投資されていますか？</p>
        </div>
        <div style="opacity: 0.75;">
          <p style="margin: 0; font-size: 12px; color: #6E6E73;">네, 좋아요. A안과 B안 중에 뭘 먼저 보여 드릴까요?</p>
          <p style="margin: 4px 0 0; font-size: 18px; line-height: 1.3; font-weight: 600;">はい、大丈夫です。A案とB案、どちらを先にお見せしましょうか？</p>
        </div>
        <div>
          <p style="margin: 0; font-size: 13px; color: #6E6E73;">来週のデモ、木曜日でも大丈夫ですか？</p>
          <p style="margin: 4px 0 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;">다음 주 데모, 목요일도 괜찮으세요?</p>
        </div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0A84FF","#5E5CE6"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
