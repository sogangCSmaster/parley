<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}a:hover{text-decoration:underline}
input::placeholder{color:#8E8E93}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;">
  <div style="align-self: stretch; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
    <a href="#" aria-label="Tolkmeet" style="display: flex; align-items: center; gap: 6px; color: #1D1D1F; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;">
      <svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>
      tolkmeet
    </a>
    <span style="font-size: 14px; color: #6E6E73;">이미 계정이 있나요? <a href="#">로그인</a></span>
  </div>

  <div style="margin-top: 48px; width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em;">계정 만들기</h1>
    <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.5; color: #6E6E73;">회의를 만드는 사람만 계정이 있으면 됩니다.<br>함께하는 사람은 링크로 바로 참여합니다.</p>
  </div>

  <form style="margin-top: 32px; width: 440px; display: flex; flex-direction: column; gap: 14px;">
    <button type="button" style="height: 52px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; color: #1D1D1F; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.4 9.1 5.4 12 5.4z"/></svg>
      Google로 계속하기
    </button>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6E6E73;"><span style="flex: 1; height: 1px; background: #D2D2D7;"></span>또는 이메일로<span style="flex: 1; height: 1px; background: #D2D2D7;"></span></div>
    <div style="display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1px solid #D2D2D7; background: #FFFFFF;">
      <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-bottom: 1px solid #E5E5EA;">
        <span style="font-size: 12px; color: #6E6E73;">이름</span>
        <input type="text" value="유민준" style="border: 0; padding: 0; font: inherit; font-size: 17px; color: #1D1D1F; outline: none; background: transparent;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-bottom: 1px solid #E5E5EA;">
        <span style="font-size: 12px; color: #6E6E73;">이메일</span>
        <input type="email" placeholder="name@company.com" style="border: 0; padding: 0; font: inherit; font-size: 17px; color: #1D1D1F; outline: none; background: transparent;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px;">
        <span style="font-size: 12px; color: #6E6E73;">비밀번호</span>
        <input type="password" placeholder="8자 이상" style="border: 0; padding: 0; font: inherit; font-size: 17px; color: #1D1D1F; outline: none; background: transparent;">
      </label>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6E6E73;">계속하면 <a href="#">이용약관</a>과 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다. 회의 음성은 번역을 위해 Google Gemini로 전송되며 저장하지 않습니다.</p>
    <button type="submit" style="height: 54px; border: 0; border-radius: 14px; background: {{button}}; color: #FFFFFF; font-size: 19px; font-weight: 700;">계정 만들기</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
