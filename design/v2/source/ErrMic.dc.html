<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마이크 권한 거부</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">
  <span style="width: 88px; height: 88px; border-radius: 44px; display: grid; place-items: center; background: #FFFFFF; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.2);">
    <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>
  </span>
  <h1 style="margin: 22px 0 0; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">마이크를 쓸 수 없습니다</h1>
  <p style="margin: 10px 0 0; max-width: 460px; text-align: center; font-size: 16px; line-height: 1.55; color: #6E6E73;">말을 자막으로 바꾸려면 마이크가 필요합니다. 브라우저에서 이 사이트의 마이크를 허용해 주세요.</p>
  <ol style="margin: 20px 0 0; padding: 18px 22px 18px 40px; width: 460px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; font-size: 15px; line-height: 1.6;">
    <li>주소창 왼쪽의 사이트 정보 아이콘을 누릅니다</li>
    <li>마이크를 <b style="font-weight: 600;">허용</b>으로 바꿉니다</li>
    <li>아래 버튼을 눌러 다시 시도합니다</li>
  </ol>
  <div style="margin-top: 22px; display: flex; gap: 10px;">
    <button type="button" style="height: 46px; padding: 0 20px; border: 0; border-radius: 23px; background: #E8E8ED; color: #1D1D1F; font-size: 16px; font-weight: 600;">듣기만 하고 참여</button>
    <button type="button" style="height: 46px; padding: 0 22px; border: 0; border-radius: 23px; background: {{button}}; color: #FFFFFF; font-size: 16px; font-weight: 700;">다시 시도</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
