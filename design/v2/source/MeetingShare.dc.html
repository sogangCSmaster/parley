<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화면 공유 중, 전체 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A}a:hover{color:#9E2D14}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; color: #1D1D1F;">

  <div style="position: absolute; inset: 0; padding: 96px 120px; display: flex; flex-direction: column; gap: 32px;">
    <p style="margin: 0; font-size: 17px; font-weight: 600; color: #6E6E73;">2026 일본 유통 제안서 · 03 / 12</p>
    <h1 style="margin: 0; font-size: 72px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em;">지역별 대리점 구조</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 16px; max-width: 900px;">
      <div style="padding: 28px; border-radius: 20px; background: #F5F5F7;"><p style="margin: 0; font-size: 16px; color: #6E6E73;">관동</p><p style="margin: 10px 0 0; font-size: 44px; font-weight: 700;">[수치]</p></div>
      <div style="padding: 28px; border-radius: 20px; background: #F5F5F7;"><p style="margin: 0; font-size: 16px; color: #6E6E73;">관서</p><p style="margin: 10px 0 0; font-size: 44px; font-weight: 700;">[수치]</p></div>
      <div style="padding: 28px; border-radius: 20px; background: #F5F5F7;"><p style="margin: 0; font-size: 16px; color: #6E6E73;">규슈</p><p style="margin: 10px 0 0; font-size: 44px; font-weight: 700;">[수치]</p></div>
    </div>
    <div style="height: 260px; max-width: 900px; border-radius: 20px; background: #F5F5F7; display: grid; place-items: center; font-size: 16px; color: #6E6E73;">[차트 자리]</div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; box-shadow: inset 0 0 0 4px #F2542D; pointer-events: none;"></div>

  <aside aria-label="자막 미니 창" style="position: absolute; right: 28px; bottom: 28px; width: 380px; border-radius: 20px; overflow: hidden; background: rgba(28,28,30,0.88); backdrop-filter: blur(30px) saturate(1.6); color: #F5F5F7; box-shadow: 0 24px 60px -16px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #F2542D;"></span>
      <span style="flex: 1; font-size: 12px; font-weight: 600; color: rgba(235,235,245,0.8);">화면 공유 중</span>
      <button type="button" aria-label="마이크" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: grid; place-items: center;"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: #FF3B30; color: #FFFFFF; font-size: 12px; font-weight: 700;">공유 중지</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 18px 18px;">
      <div style="opacity: 0.5;">
        <p style="margin: 0; font-size: 11px; color: rgba(235,235,245,0.6);">さくら  はい、昨年の実績です。</p>
        <p style="margin: 2px 0 0; font-size: 15px; font-weight: 600;">네, 작년 실적입니다.</p>
      </div>
      <div style="display: flex; gap: 12px; align-items: flex-start;">
        <span style="flex: none; width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; background: linear-gradient(180deg, #A2A6B0 0%, #7D818C 100%); color: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: 0 0 0 2px #F2542D;">さ</span>
        <div>
          <p style="margin: 0; font-size: 12px; color: rgba(235,235,245,0.6);">関西はどのくらい伸びそうですか？</p>
          <p style="margin: 3px 0 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;">관서는 얼마나 늘 것 같나요?</p>
        </div>
      </div>
    </div>
  </aside>

  <p style="position: absolute; left: 28px; bottom: 28px; margin: 0; max-width: 420px; padding: 10px 14px; border-radius: 12px; background: #1D1D1F; color: #F5F5F7; font-size: 13px; line-height: 1.45;">자막 미니 창은 전체 화면 위에도 항상 떠 있고, 상대에게는 공유되지 않습니다. 끌어서 옮기거나 크기를 바꿀 수 있습니다.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0A84FF","#5E5CE6"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
