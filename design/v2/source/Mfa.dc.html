<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>2차 인증</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381A;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;">
  <div style="align-self: stretch; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;">
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; letter-spacing: -0.05em;"><svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="28" width="62" height="16" rx="8" fill="#1D1D1F"/><rect x="26" y="52" width="62" height="16" rx="8" fill="{{accent}}"/></svg>tolkmeet</span>
    <a href="SignIn.dc.html" style="font-size: 14px;">다른 계정으로 로그인</a>
  </div>
  <div style="margin-top: 96px; width: 460px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <span style="width: 88px; height: 88px; border-radius: 44px; display: grid; place-items: center; background: #FFFFFF; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.2);">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/><path d="M12 7.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="{{accent}}" stroke="none"/></svg>
    </span>
    <h1 style="margin: 24px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em;">2차 인증</h1>
    <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.55; color: #6E6E73;">인증 앱(Google Authenticator, 1Password 등)에 표시된 6자리 코드를 입력하세요.</p>
    <form style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; gap: 10px;">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden;">인증 앱 코드 6자리</legend>
        <input aria-label="1번째 숫자" value="2" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="2번째 숫자" value="9" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="3번째 숫자" value="" style="width: 56px; height: 68px; border: 2px solid {{accent}}; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="4번째 숫자" value="" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="5번째 숫자" value="" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
        <input aria-label="6번째 숫자" value="" style="width: 56px; height: 68px; border: 1px solid #D2D2D7; border-radius: 14px; background: #FFFFFF; text-align: center; font: inherit; font-size: 30px; font-weight: 600; color: #1D1D1F;">
      </fieldset>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 15px;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #C2381A;">이 기기는 30일 동안 다시 묻지 않기</label>
    </form>
    <div style="margin-top: 32px; width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <a href="Passkey.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D2D2D7; color: #1D1D1F; font-size: 16px; font-weight: 600; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="4"/><path d="M2 21c.6-3.6 3-5.5 6-5.5 1.3 0 2.5.3 3.4 1M15 12a3 3 0 1 1 3 3v6l-1.5-1.5L15 21l1.5-1.5L15 18"/></svg>
        대신 패스키 사용
      </a>
      <a href="#" style="font-size: 14px; margin-top: 6px;">인증 앱을 쓸 수 없나요? 복구 코드 입력</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2542D","options":["#F2542D","#0071E3","#1D1D1F"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#F2542D';
// 버튼 바탕은 브랜드 주황보다 한 단계 진하게: 흰 글씨 대비 4.6:1. 로고·막대 같은 포인트는 원래 주황.
return { accent, button: accent.toUpperCase() === '#F2542D' ? '#D4401C' : accent };
}
}
</script>
</body>
</html>
